version: '3'

tasks:
  default:
    cmds:
      - task: update

  update:
    cmds:
      - go run ./cmd/fs_generator/ -name microboiler_grpc_server -src ../microboiler_grpc_server/
      - go run ./cmd/fs_generator/ -name microboiler_rest_server -src ../microboiler_rest_server/

  run:
    cmds:
      - go run ./cmd/microboiler/

  build:
    cmds:
      - go build -o bin/fs_generator ./cmd/fs_generator
      - go build -o bin/microboiler ./cmd/microboiler

  check:
    deps:
      - update
    cmds:
      - rm -rf /tmp/some/check
      - go run ./cmd/microboiler/ -name check -opt grpc_server -opt rest_server

  lint:
    desc: Run linter
    cmds:
      - go fmt ./...
      - go vet ./...

