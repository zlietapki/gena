version: '3'

tasks:
  default:
    cmds:
      - task: update

  update:
    cmds:
      - go run ./cmd/indexer/ add -name gena_grpc_server -src ../gena_grpc_server/
      - go run ./cmd/indexer/ add -name gena_rest_server -src ../gena_rest_server/
      - go run ./cmd/indexer/ add -name gena_kafka_producer -src ../gena_kafka_producer/

  run:
    cmds:
      - go run ./cmd/gena/

  build:
    cmds:
      - go build -o bin/indexer ./cmd/indexer
      - go build -o bin/gena ./cmd/gena

  check:
    desc: Run full project validation (11 stages)
    cmds:
      - bash scripts/check.sh

  lint:
    desc: Run linter
    cmds:
      - go fmt ./...
      - go vet ./...

