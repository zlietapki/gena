<svg width="1360" height="680" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect x="0" y="0" width="680" height="340" rx="16" fill="#0D1117"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#C9D1D9" stroke-width="0.5">
    <line x1="0" y1="40" x2="680" y2="40"/><line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="120" x2="680" y2="120"/><line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="200" x2="680" y2="200"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="280" x2="680" y2="280"/>
    <line x1="40" y1="0" x2="40" y2="340"/><line x1="80" y1="0" x2="80" y2="340"/>
    <line x1="120" y1="0" x2="120" y2="340"/><line x1="160" y1="0" x2="160" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/><line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="280" y1="0" x2="280" y2="340"/><line x1="320" y1="0" x2="320" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/><line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="440" y1="0" x2="440" y2="340"/><line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="520" y1="0" x2="520" y2="340"/><line x1="560" y1="0" x2="560" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/><line x1="640" y1="0" x2="640" y2="340"/>
  </g>

  <!-- Accent glow blobs -->
  <ellipse cx="120" cy="170" rx="100" ry="80" fill="#00ADD8" opacity="0.07"/>
  <ellipse cx="580" cy="170" rx="90" ry="70" fill="#6E7FAA" opacity="0.08"/>

  <!-- Decorative rings -->
  <g opacity="0.12">
    <circle cx="340" cy="170" r="130" fill="none" stroke="#00ADD8" stroke-width="1"/>
    <circle cx="340" cy="170" r="105" fill="none" stroke="#00ADD8" stroke-width="0.5"/>
  </g>

  <!-- Template boxes on the left -->
  <g opacity="0.9">
    <rect x="28" y="60" width="120" height="52" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text font-family="'Courier New', monospace" font-size="9" fill="#6E7FAA" x="38" y="78">template</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#C9D1D9" font-weight="700" x="38" y="94">rest-api</text>

    <rect x="28" y="130" width="120" height="52" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text font-family="'Courier New', monospace" font-size="9" fill="#6E7FAA" x="38" y="148">template</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#C9D1D9" font-weight="700" x="38" y="164">grpc-svc</text>

    <rect x="28" y="200" width="120" height="52" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text font-family="'Courier New', monospace" font-size="9" fill="#6E7FAA" x="38" y="218">template</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#C9D1D9" font-weight="700" x="38" y="234">kafka-consumer</text>
  </g>

  <!-- Flow lines from templates to merger -->
  <line stroke-dasharray="6 4" x1="148" y1="86" x2="234" y2="154" stroke="#00ADD8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line stroke-dasharray="6 4" x1="148" y1="156" x2="234" y2="163" stroke="#00ADD8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line stroke-dasharray="6 4" x1="148" y1="226" x2="234" y2="175" stroke="#00ADD8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Central merger box -->
  <rect x="234" y="136" width="88" height="48" rx="8" fill="#00ADD8" opacity="0.15" stroke="#00ADD8" stroke-width="1.5"/>
  <text font-family="'Courier New', monospace" font-size="10" fill="#00ADD8" font-weight="700" x="278" y="157" text-anchor="middle">merge</text>
  <text font-family="'Courier New', monospace" font-size="9" fill="#7EC8DA" x="278" y="172" text-anchor="middle">templates</text>

  <!-- Arrow from merger to output -->
  <line stroke-dasharray="6 4" x1="322" y1="160" x2="360" y2="160" stroke="#00ADD8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Main title block -->
  <text font-family="'Courier New', monospace" font-size="54" font-weight="700" fill="#C9D1D9" x="370" y="130" letter-spacing="-1">Gena</text>
  <text font-family="'Courier New', monospace" font-size="12" fill="#6E7FAA" x="372" y="152">Go project generator</text>

  <!-- Tech tags -->
  <rect x="372" y="170" width="52" height="22" rx="4" fill="#0D419D" opacity="0.8"/>
  <text font-family="'Courier New', monospace" font-size="10" fill="#79C0FF" x="398" y="185" text-anchor="middle" font-weight="700">REST</text>

  <rect x="432" y="170" width="52" height="22" rx="4" fill="#1D3A1B" opacity="0.9"/>
  <text font-family="'Courier New', monospace" font-size="10" fill="#56D364" x="458" y="185" text-anchor="middle" font-weight="700">gRPC</text>

  <rect x="492" y="170" width="52" height="22" rx="4" fill="#3A2A00" opacity="0.9"/>
  <text font-family="'Courier New', monospace" font-size="10" fill="#E3B341" x="518" y="185" text-anchor="middle" font-weight="700">Kafka</text>

  <rect x="552" y="170" width="88" height="22" rx="4" fill="#1A2F42" opacity="0.9"/>
  <text font-family="'Courier New', monospace" font-size="10" fill="#58A6FF" x="596" y="185" text-anchor="middle" font-weight="700">PostgreSQL</text>

  <!-- Output project code block -->
  <rect x="372" y="206" width="268" height="96" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="388" cy="220" r="4" fill="#FF5F57"/>
  <circle cx="402" cy="220" r="4" fill="#FFBD2E"/>
  <circle cx="416" cy="220" r="4" fill="#28C840"/>
  <text font-family="'Courier New', monospace" font-size="9" fill="#6E7FAA" x="388" y="238">$ gena new \</text>
  <text font-family="'Courier New', monospace" font-size="9" fill="#6E7FAA" x="396" y="252">  -use gena_grpc_server \</text>
  <text font-family="'Courier New', monospace" font-size="9" fill="#6E7FAA" x="396" y="266">  -use gena_rest_server -out my-service</text>
  <text font-family="'Courier New', monospace" font-size="9" fill="#56D364" x="388" y="285">&#x2713; Generated: my-service/</text>

  <!-- Bottom caption -->
  <text font-family="'Courier New', monospace" font-size="10" fill="#484F58" x="340" y="322" text-anchor="middle">Generate · Merge · Build · Ship</text>

  <!-- Go brand mark -->
  <circle cx="88" cy="285" r="18" fill="#00ADD8" opacity="0.15"/>
  <text font-family="'Courier New', monospace" font-size="16" fill="#00ADD8" font-weight="700" x="88" y="291" text-anchor="middle">Go</text>

  <!-- Border frame -->
  <rect x="1" y="1" width="678" height="338" rx="16" fill="none" stroke="#30363D" stroke-width="1.5"/>
</svg>
