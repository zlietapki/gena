                    - "\t}"
                    - "\treturn &kgo.Record{"
                    - "\t\tKey:       []byte(e.Key),"
                    - "\t\tValue:     value,"
                    - "\t\tTimestamp: e.Timestamp,"
                    - "\t}, nil"
                    - '}'
        - name: usecase
