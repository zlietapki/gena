        - name: kafka
          mode: 755
          files:
            - name: client.go
              mode: 644
              blocks:
                - name: noblocks
                  type: single
                  data:
                    - package kafka
                    - ""
                    - import (
                    - "\t\"context\""
                    - "\t\"fmt\""
                    - "\t\"time\""
                    - ""
                    - "\t\"github.com/twmb/franz-go/pkg/kgo\""
                    - "\t\"github.com/twmb/franz-go/pkg/sasl/scram\""
                    - )
                    - ""
                    - type Client struct {
                    - "\tkgoClient   *kgo.Client"
                    - "\tstopTimeout time.Duration"
                    - '}'
                    - ""
                    - func (c Client) Kgo() *kgo.Client {
                    - "\treturn c.kgoClient"
                    - '}'
                    - ""
                    - func NewClient(cfg Config) (*Client, error) {
                    - "\topts := []kgo.Opt{"
                    - "\t\tkgo.SeedBrokers(cfg.Brokers...),"
                    - "\t\tkgo.RequestRetries(cfg.RequestRetries),"
                    - "\t\tkgo.RetryTimeout(cfg.RetryTimeout),"
                    - "\t\tkgo.DialTimeout(cfg.DialTimeout),"
                    - "\t\tkgo.DefaultProduceTopic(cfg.Topic),"
                    - "\t}"
                    - ""
                    - "\tif cfg.User != \"\" {"
                    - "\t\tswitch cfg.SASLMechanism {"
                    - "\t\tcase \"SCRAM-SHA-256\":"
                    - "\t\t\topts = append(opts, kgo.SASL("
                    - "\t\t\t\tscram.Auth{"
                    - "\t\t\t\t\tUser: cfg.User,"
                    - "\t\t\t\t\tPass: cfg.Password,"
                    - "\t\t\t\t}.AsSha256Mechanism(),"
                    - "\t\t\t))"
                    - "\t\tcase \"SCRAM-SHA-512\":"
                    - "\t\t\topts = append(opts, kgo.SASL("
                    - "\t\t\t\tscram.Auth{"
                    - "\t\t\t\t\tUser: cfg.User,"
                    - "\t\t\t\t\tPass: cfg.Password,"
                    - "\t\t\t\t}.AsSha512Mechanism()),"
                    - "\t\t\t)"
                    - "\t\t}"
                    - "\t}"
                    - ""
                    - "\tkgoClient, err := kgo.NewClient(opts...)"
                    - "\tif err != nil {"
                    - "\t\treturn nil, fmt.Errorf(\"create kafka client: %w\", err)"
                    - "\t}"
                    - ""
                    - "\tctx, cancel := context.WithTimeout(context.Background(), cfg.DialTimeout)"
                    - "\tdefer cancel()"
                    - "\terr = kgoClient.Ping(ctx)"
                    - "\tif err != nil {"
                    - "\t\treturn nil, fmt.Errorf(\"ping kafka client: %w\", err)"
                    - "\t}"
                    - ""
                    - "\treturn &Client{"
                    - "\t\tkgoClient:   kgoClient,"
                    - "\t\tstopTimeout: cfg.StopTimeout,"
                    - "\t}, nil"
                    - '}'
                    - ""
                    - func (c Client) Stop() error {
                    - "\tctx, cancel := context.WithTimeout(context.Background(), c.stopTimeout)"
                    - "\tdefer cancel()"
                    - ""
                    - "\tif err := c.kgoClient.Flush(ctx); err != nil {"
                    - "\t\treturn fmt.Errorf(\"flush timeout, some records may be lost: %w\", err)"
                    - "\t}"
                    - ""
                    - "\tc.kgoClient.Close()"
                    - "\treturn nil"
                    - '}'
            - name: config.go
              mode: 644
              blocks:
                - name: noblocks
                  type: single
                  data:
                    - package kafka
                    - ""
                    - import "time"
                    - ""
                    - type Config struct {
                    - "\tBrokers         []string      `envconfig:\"KAFKA_BROKERS\"`"
                    - "\tUser            string        `envconfig:\"KAFKA_USER\"`"
                    - "\tPassword        string        `envconfig:\"KAFKA_PASSWORD\"`"
                    - "\tSASLMechanism   string        `envconfig:\"KAFKA_SASL_MECHANISM\" default:\"SCRAM-SHA-256\"`"
                    - "\tTopic           string        `envconfig:\"KAFKA_TOPIC\"`"
                    - "\tRequestRetries  int           `envconfig:\"KAFKA_REQUEST_RETRIES\" default:\"3\"`"
                    - "\tRetryTimeout    time.Duration `envconfig:\"KAFKA_RETRY_TIMEOUT\" default:\"5s\"`"
                    - "\tConnIdleTimeout time.Duration `envconfig:\"KAFKA_CONN_IDLE_TIMEOUT\" default:\"5s\"`"
                    - "\tDialTimeout     time.Duration `envconfig:\"KAFKA_DIAL_TIMEOUT\" default:\"5s\"`"
                    - "\tStopTimeout     time.Duration `envconfig:\"KAFKA_STOP_TIMEOUT\" default:\"5s\"`"
                    - '}'
            - name: kafka_producer.go
              mode: 644
              blocks:
                - name: noblocks
                  type: single
                  data:
                    - package kafka
                    - ""
                    - import (
                    - "\t\"context\""
                    - "\t\"log/slog\""
                    - "\t\"sync\""
                    - ""
                    - "\t\"github.com/twmb/franz-go/pkg/kgo\""
                    - "\t\"github.com/zlietapki/gena/internal/domain\""
                    - )
                    - ""
                    - type Producer struct {
                    - "\tclient *kgo.Client"
                    - '}'
                    - ""
                    - func NewProducer(client *kgo.Client) *Producer {
                    - "\treturn &Producer{"
                    - "\t\tclient: client,"
                    - "\t}"
                    - '}'
                    - ""
                    - func (p Producer) Publish(ctx context.Context, events []domain.Event) error {
                    - "\tvar wg sync.WaitGroup"
                    - ""
                    - "\tfor _, e := range events {"
                    - "\t\trecord, err := toKgoRecord(e)"
                    - "\t\tif err != nil {"
                    - "\t\t\treturn err"
                    - "\t\t}"
                    - ""
                    - "\t\twg.Add(1)"
                    - "\t\tp.client.Produce(ctx, record, func(r *kgo.Record, err error) {"
                    - "\t\t\tdefer wg.Done()"
                    - ""
                    - "\t\t\tif err != nil {"
                    - "\t\t\t\tslog.Error(\"Kafka produce err\", \"key\", r.Key, \"err\", err)"
                    - "\t\t\t\treturn"
                    - "\t\t\t}"
                    - ""
                    - "\t\t\tslog.Info(\"Delivered\", \"topic\", r.Topic, \"partition\", r.Partition, \"offset\", r.Offset, \"key\", r.Key)"
                    - "\t\t})"
                    - ""
                    - "\t}"
                    - "\twg.Wait()"
                    - ""
                    - "\treturn nil"
                    - '}'
            - name: message.go
              mode: 644
