                    - package grpcserver
                    - ""
                    - import (
                    - "\t\"net\""
                    - ""
                    - "\t\"google.golang.org/grpc\""
                    - "\t\"google.golang.org/grpc/health\""
                    - "\t\"google.golang.org/grpc/health/grpc_health_v1\""
                    - "\t\"google.golang.org/grpc/reflection\""
                    - )
                    - ""
                    - type addHandlerFunc func(s *grpc.Server)
                    - ""
                    - type Server struct {
                    - "\tlisten     string"
                    - "\tsrv        *grpc.Server"
                    - "\taddHandler addHandlerFunc"
                    - "\topts       []grpc.ServerOption"
                    - '}'
                    - ""
                    - func New(listen string, addHandler addHandlerFunc, opts ...grpc.ServerOption) *Server {
                    - "\tdefaultOpts := []grpc.ServerOption{"
                    - "\t\tgrpc.ChainUnaryInterceptor(recoveryInterceptor()),"
                    - "\t}"
                    - "\tdefaultOpts = append(defaultOpts, opts...)"
                    - ""
                    - "\treturn &Server{"
                    - "\t\tlisten:     listen,"
                    - "\t\taddHandler: addHandler,"
                    - "\t\topts:       defaultOpts,"
                    - "\t}"
                    - '}'
                    - ""
                    - func (s *Server) Start() chan error {
                    - "\ts.srv = grpc.NewServer(s.opts...)"
                    - "\treflection.Register(s.srv)"
                    - ""
                    - "\thsrv := health.NewServer()"
                    - "\tgrpc_health_v1.RegisterHealthServer(s.srv, hsrv)"
                    - ""
                    - "\ts.addHandler(s.srv)"
                    - ""
                    - "\terrCh := make(chan error)"
                    - ""
                    - "\tlis, err := net.Listen(\"tcp\", s.listen)"
                    - "\tif err != nil {"
                    - "\t\tgo func() {"
                    - "\t\t\terrCh <- err"
                    - "\t\t}()"
                    - ""
                    - "\t\treturn errCh"
                    - "\t}"
                    - ""
                    - "\tgo func() {"
                    - "\t\terrCh <- s.srv.Serve(lis)"
                    - "\t}()"
                    - ""
                    - "\treturn errCh"
                    - '}'
                    - ""
                    - func (s *Server) Stop() {
                    - "\ts.srv.GracefulStop()"
                    - '}'
            - name: interceptors.go
              mode: 644
              blocks:
                - name: noblocks
                  type: single
                  data:
                    - package grpcserver
                    - ""
                    - import (
                    - "\t\"context\""
                    - "\t\"log/slog\""
                    - ""
                    - "\t\"google.golang.org/grpc\""
                    - "\t\"google.golang.org/grpc/codes\""
                    - "\t\"google.golang.org/grpc/status\""
                    - )
                    - ""
                    - func recoveryInterceptor() grpc.UnaryServerInterceptor {
                    - "\treturn func(ctx context.Context, req any, info *grpc.UnaryServerInfo, handler grpc.UnaryHandler) (resp any, err error) {"
                    - "\t\tdefer func() {"
                    - "\t\t\tif r := recover(); r != nil {"
                    - "\t\t\t\tslog.Error(\"panic recovered\", \"method\", info.FullMethod, \"panic\", r)"
                    - "\t\t\t\terr = status.Errorf(codes.Internal, \"internal error\")"
                    - "\t\t\t}"
                    - "\t\t}()"
                    - "\t\treturn handler(ctx, req)"
                    - "\t}"
                    - '}'
